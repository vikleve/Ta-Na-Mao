<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 85" fill="none">
  <defs>
    <!-- Bold comic drop shadow -->
    <filter id="comicShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#051224" flood-opacity="0.95" />
    </filter>
  </defs>

  <!-- Speed Burst Lines (Left) -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95">
    <line x1="6" y1="26" x2="22" y2="29" />
    <line x1="3" y1="42" x2="19" y2="42" />
    <line x1="8" y1="58" x2="24" y2="54" />
  </g>
  <!-- Yellow Spark Rays -->
  <g stroke="#fec20c" stroke-width="3" stroke-linecap="round">
    <line x1="10" y1="16" x2="26" y2="23" />
    <line x1="12" y1="68" x2="28" y2="60" />
    <line x1="126" y1="16" x2="138" y2="23" />
    <line x1="128" y1="64" x2="140" y2="57" />
  </g>

  <!-- Logo Badge Group -->
  <g transform="translate(16, 0)">
    <!-- "TÁ NA" Text -->
    <g transform="rotate(-4 65 30)">
      <text x="18" y="38" 
            font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" 
            font-size="30" 
            font-weight="900" 
            letter-spacing="0.5"
            fill="#ffffff" 
            stroke="#0a1a32" 
            stroke-width="7" 
            stroke-linejoin="round"
            filter="url(#comicShadow)">
        TÁ NA
      </text>
      <text x="18" y="38" 
            font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" 
            font-size="30" 
            font-weight="900" 
            letter-spacing="0.5"
            fill="#ffffff">
        TÁ NA
      </text>
    </g>

    <!-- "MÃO" Text -->
    <g transform="rotate(2 68 64)">
      <text x="14" y="69" 
            font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" 
            font-size="38" 
            font-weight="950" 
            letter-spacing="1"
            fill="#ffffff" 
            stroke="#0a1a32" 
            stroke-width="8" 
            stroke-linejoin="round"
            filter="url(#comicShadow)">
        MÃO
      </text>
      <text x="14" y="69" 
            font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" 
            font-size="38" 
            font-weight="950" 
            letter-spacing="1"
            fill="#ffffff">
        MÃO
      </text>
    </g>
  </g>

  <!-- Yellow Pointer Arrow -->
  <polygon points="146,38 158,44 146,50" fill="#fec20c" />

  <!-- Slogan "Encontre quem resolve" -->
  <text x="168" y="49" 
        font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
        font-size="16" 
        font-weight="700" 
        letter-spacing="0.2"
        fill="#ffffff">
    Encontre quem resolve
  </text>
</svg>
